name: Deploy to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore PathlyAI_API/PathlyAI_API.csproj

      - name: Build
        run: dotnet build PathlyAI_API/PathlyAI_API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish PathlyAI_API/PathlyAI_API.csproj --configuration Release --no-build -o ./publish

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/pathly-api
            sudo systemctl stop pathly-api
            rm -rf ./publish
            mkdir -p ./publish
          timeout: 60s

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./publish/*"
          target: "/opt/pathly-api/publish"

      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/pathly-api
            sudo systemctl start pathly-api
            sleep 5
            sudo systemctl status pathly-api --no-pager
          timeout: 60s